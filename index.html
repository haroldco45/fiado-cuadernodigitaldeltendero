<style>

<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">Fiado</div>
      <div class="tienda" id="hTienda">Mi tienda</div>
    </div>
    <button class="gear" id="btnGear" aria-label="Ajustes">⚙︎</button>
    <div class="clock" id="clock" aria-live="off"><b>--:--</b><span>Colombia</span></div>
  </header>

  <main id="main"><!-- render --></main>

  <button class="fab" id="fab">＋ Fiar</button>

  <footer class="credit">
    Datos guardados solo en este dispositivo · Hora oficial de Colombia (UTC−5)<br>
    Desarrollada por <b>Vibras Positivas HM</b> — Derechos de Autor Reservados
  </footer>
</div>

<div id="viewLayer"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============ Utilidades Colombia / formato ============ */
const COP = n => new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Math.round(n||0));
const NUM = n => new Intl.NumberFormat('es-CO',{maximumFractionDigits:0}).format(Math.round(n||0));
function nowCO(){
  const s = new Date().toLocaleString('en-US',{timeZone:'America/Bogota'});
  return new Date(s);
}
function isoCO(){ return nowCO().toISOString(); }
function fechaCO(iso){
  return new Date(iso).toLocaleDateString('es-CO',{timeZone:'America/Bogota',day:'2-digit',month:'short',year:'numeric'});
}
function diasDesde(iso){
  const a=nowCO(); a.setHours(0,0,0,0);
  const b=new Date(new Date(iso).toLocaleString('en-US',{timeZone:'America/Bogota'})); b.setHours(0,0,0,0);
  return Math.max(0,Math.round((a-b)/86400000));
}
function esHoyCO(iso){
  const d=new Date(iso).toLocaleDateString('en-CA',{timeZone:'America/Bogota'});
  const h=nowCO().toLocaleDateString('en-CA',{timeZone:'America/Bogota'});
  return d===h;
}
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const initials = nm => (nm||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
const maskPhone = p => { p=(p||'').replace(/\D/g,''); return p? '••• ••• '+p.slice(-2) : 'Sin teléfono'; };

/* ============ IndexedDB ============ */
const DB_NAME='tendero_fiado', DB_VER=1;
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('clientes')) d.createObjectStore('clientes',{keyPath:'id'});
      if(!d.objectStoreNames.contains('movimientos')){const m=d.createObjectStore('movimientos',{keyPath:'id'});m.createIndex('cliente','clienteId',{unique:false});}
      if(!d.objectStoreNames.contains('config')) d.createObjectStore('config',{keyPath:'k'});
    };
    r.onsuccess=e=>{db=e.target.result;res(db);};
    r.onerror=e=>rej(e.target.error);
  });
}
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store);}
const put = (s,v)=>new Promise((res,rej)=>{const r=tx(s,'readwrite').put(v);r.onsuccess=()=>res(v);r.onerror=()=>rej(r.error);});
const del = (s,k)=>new Promise((res,rej)=>{const r=tx(s,'readwrite').delete(k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});
const getAll = s=>new Promise((res,rej)=>{const r=tx(s).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});
const getOne = (s,k)=>new Promise((res,rej)=>{const r=tx(s).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const clearStore = s=>new Promise((res,rej)=>{const r=tx(s,'readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});

/* ============ Estado en memoria ============ */
let CLIENTES=[], MOVS=[], CFG={k:'cfg',tienda:'Mi tienda',tendero:'',plantilla:'', verTodos:false, verTelefono:false};
let mostrarTodosFiltro = false; // toggle para ver deudores o todos

async function cargarTodo(){
  CLIENTES = await getAll('clientes');
  MOVS = await getAll('movimientos');
  const c = await getOne('config','cfg');
  if(c) CFG = Object.assign(CFG,c);
  document.getElementById('hTienda').textContent = CFG.tienda||'Mi tienda';
}
async function guardarCfg(){ CFG.k='cfg'; await put('config',CFG); document.getElementById('hTienda').textContent=CFG.tienda||'Mi tienda'; }

function saldoDe(id){
  return MOVS.filter(m=>m.clienteId===id).reduce((s,m)=> s + (m.tipo==='fiado'? (+m.monto||0) : -(+m.monto||0)), 0);
}
function movsDe(id){ return MOVS.filter(m=>m.clienteId===id).sort((a,b)=> new Date(b.fecha)-new Date(a.fecha)); }
function deudaMasVieja(id){
  const fs = MOVS.filter(m=>m.clienteId===id && m.tipo==='fiado').sort((a,b)=> new Date(a.fecha)-new Date(b.fecha));
  return fs.length? diasDesde(fs[0].fecha) : 0;
}
function tempClase(dias){ return dias>30?'t-rojo':dias>=15?'t-ambar':'t-verde'; }
function tempPct(dias){ return Math.min(100, Math.max(14, Math.round(dias/45*100))); }

/* ============ Render: Inicio ============ */
const main=document.getElementById('main');
let filtro='';

function render(){
  const todosCalculados = CLIENTES.map(c=>({c,saldo:saldoDe(c.id),vieja:deudaMasVieja(c.id)}));
  const conSaldo = todosCalculados.filter(x=>x.saldo>0.5);
  const totalPorCobrar = conSaldo.reduce((s,x)=>s+x.saldo,0);
  const cobradoHoy = MOVS.filter(m=>m.tipo==='abono'&&esHoyCO(m.fecha)).reduce((s,m)=>(+m.monto||0)+s,0);
  const nDeudores = conSaldo.length;
  const alDia = CLIENTES.length - conSaldo.length;

  if(CLIENTES.length===0){
    main.innerHTML = `
      <div class="hero"><div class="lbl">Total por cobrar</div><div class="big money">${COP(0)}</div>
        <div class="sub">Tu cuaderno de fiado empieza aquí.</div></div>
      <div class="empty">
        <div class="em">📓</div>
        <h3>Aún no tienes fiados</h3>
        <p>Registra a quién le fías y cobra fácil por WhatsApp.<br>Todo se guarda en tu teléfono, sin internet.</p>

        <div style="height:10px"></div>
        <button class="btn btn-ghost" onclick="cargarEjemplo()">Ver con datos de ejemplo</button>

  // Lista base según pestaña o buscador
  let lista = [];
  if(filtro){
    const f=filtro.toLowerCase();
    lista = todosCalculados.filter(x=>x.c.nombre.toLowerCase().includes(f))
                           .sort((a,b)=>b.saldo-a.saldo);
  } else if(mostrarTodosFiltro){
    lista = todosCalculados.sort((a,b)=>b.saldo-a.saldo || a.c.nombre.localeCompare(b.c.nombre));
  } else {
    lista = conSaldo.sort((a,b)=>b.saldo-a.saldo);
  }

  main.innerHTML = `
    <div class="hero">
      ${cobradoHoy>0?`<div class="paidchip">Hoy cobraste ${COP(cobradoHoy)}</div>`:''}
      <div class="lbl">Total por cobrar</div>
      <div class="big money">${COP(totalPorCobrar)}</div>
      <div class="sub">${nDeudores} ${nDeudores===1?'persona te debe':'personas te deben'}${alDia>0?` · ${alDia} al día`:''}</div>
    </div>
    <div class="stats">
      <div class="stat red"><div class="n money">${nDeudores}</div><div class="l">Deben plata</div></div>
      <div class="stat green"><div class="n money">${COP(cobradoHoy)}</div><div class="l">Cobrado hoy</div></div>
    </div>
    <div class="searchbar">
      <input id="q" placeholder="Buscar cliente por nombre…" value="${filtro.replace(/"/g,'&quot;')}" inputmode="search">
    </div>

    <div class="tabs-filtro">
      <button class="tab-btn ${!mostrarTodosFiltro && !filtro ? 'active' : ''}" onclick="cambiarFiltroVista(false)">Solo deudores (${nDeudores})</button>
      <button class="tab-btn ${mostrarTodosFiltro && !filtro ? 'active' : ''}" onclick="cambiarFiltroVista(true)">Todos (${CLIENTES.length})</button>
    </div>

    <div class="sectionhead">
      <h2>${filtro?'Resultados':(mostrarTodosFiltro?'Todos los clientes':'Cuentas por cobrar')}</h2>
      <button class="link" onclick="abrirNuevoCliente()">＋ Cliente</button>
    </div>
    <div class="ledger" id="ledger">
      ${lista.length? lista.map(rowHTML).join('') :
        `<div class="empty"><div class="em">✅</div><h3>${filtro?'Sin resultados':'¡Nadie te debe!'}</h3><p>${filtro?'Prueba con otro nombre.':'Todos los clientes están al día.'}</p></div>`}
    </div>`;

  if(q){ q.oninput=e=>{filtro=e.target.value; const pos=e.target.selectionStart; render(); const nq=document.getElementById('q'); if(nq){nq.focus();nq.setSelectionRange(pos,pos);} }; }

}

function rowHTML({c,saldo,vieja}){
  const debe = saldo>0.5;
  const tc=tempClase(vieja), tp=tempPct(vieja);
  const metaTxt = debe? (vieja===0?'Hoy':`Hace ${vieja} día${vieja===1?'':'s'}`) : 'Al día';
  return `<button class="row" onclick="abrirCliente('${c.id}')">
    <div class="avatar">${initials(c.nombre)}</div>

    <div class="amt">
      <div class="v ${debe?'debe':'aldia'} money">${debe?COP(saldo):'Al día'}</div>
      ${debe?`<div class="temp ${tc}"><span style="width:${tp}%"></span></div>`:''}
    </div>
  </button>`;
}
function esc(s){return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

/* ---- Registrar fiado ---- */
function abrirFiar(clienteId){
  const opciones = CLIENTES.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const el=openView(`
    <div class="vhead"><button class="x">‹</button><h2>Registrar fiado</h2></div>
    <div class="vbody">
      <label class="f">¿A quién le fías?</label>
      <select class="f" id="selCli">
        <option value="">— Elegir cliente —</option>
        ${opciones.map(c=>`<option value="${c.id}" ${c.id===clienteId?'selected':''}>${esc(c.nombre)}</option>`).join('')}
        <option value="__new">＋ Cliente nuevo…</option>
      </select>
      <label class="f">Monto del fiado</label>
      <input class="f moneyin" id="monto" inputmode="numeric" placeholder="$0" autocomplete="off">
      <label class="f">Nº Factura / Remisión (opcional)</label>
      <input class="f" id="factura" placeholder="Ej: F-1045, Rem 88…" autocomplete="off">
      <label class="f">¿Qué se llevó? (opcional)</label>
      <input class="f" id="desc" placeholder="Ej: mercado, gaseosa…" autocomplete="off">
      <div class="chips" id="chips">
        ${['Mercado','Gaseosa','Cerveza','Pan','Cigarrillos','Recarga','Huevos','Arroz'].map(t=>`<button class="chip" data-t="${t}">${t}</button>`).join('')}
      </div>
      <div style="height:26px"></div>
      <button class="btn btn-red" id="guardar">Guardar fiado</button>
    </div>`);
  el.querySelector('.x').onclick=()=>closeView(el);
  const monto=el.querySelector('#monto');
  monto.oninput=()=>{const raw=monto.value.replace(/\D/g,''); monto.value=raw?('$'+NUM(+raw)):'';};
  el.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{el.querySelector('#desc').value=ch.dataset.t;el.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));ch.classList.add('on');});
  const sel=el.querySelector('#selCli');
  sel.onchange=()=>{ if(sel.value==='__new'){ closeView(el); abrirNuevoCliente(); } };
  el.querySelector('#guardar').onclick=async()=>{
    const cid=sel.value; const val=+monto.value.replace(/\D/g,'');
    if(!cid||cid==='__new') return toast('Elige un cliente');
    if(!val||val<=0) return toast('Escribe el monto');
    await put('movimientos',{
      id: uid(),
      clienteId: cid,
      tipo: 'fiado',
      monto: val,
      factura: el.querySelector('#factura').value.trim(),
      descripcion: el.querySelector('#desc').value.trim(),
      fecha: isoCO(),
      creado: isoCO()
    });
    await cargarTodo(); render(); closeView(el); toast('Fiado registrado ✔');
  };
  if(!clienteId) setTimeout(()=>sel.focus(),350); else setTimeout(()=>monto.focus(),350);
}

/* ---- Registrar abono ---- */
function abrirAbono(clienteId){
  const c=CLIENTES.find(x=>x.id===clienteId);
  const saldoActual=saldoDe(clienteId);

  // Extraer facturas asociadas a fiados
  const facturasCliente = [...new Set(
    MOVS.filter(m=>m.clienteId===clienteId && m.tipo==='fiado' && m.factura)
        .map(m=>m.factura.trim())
        .filter(Boolean)
  )];

  const el=openView(`
    <div class="vhead"><button class="x">‹</button><h2>Registrar abono</h2></div>
    <div class="vbody">
      <div class="detail-saldo"><div class="lbl">${esc(c.nombre)} debe</div><div class="v debe money">${COP(saldoActual)}</div></div>
      
      <label class="f">¿A qué factura abona? (opcional)</label>
      ${facturasCliente.length ? `
        <select class="f" id="selFactura" style="margin-bottom:8px">
          <option value="">— Elegir factura —</option>
          ${facturasCliente.map(f=>`<option value="${esc(f)}">Factura: #${esc(f)}</option>`).join('')}
          <option value="__otra">✏️ Escribir otra factura...</option>
        </select>
      ` : ''}
      <input class="f" id="facturaAbono" placeholder="Ej: F-1045, Rem 88…" autocomplete="off" style="${facturasCliente.length ? 'display:none;' : ''}">

      <label class="f">¿Cuánto abonó?</label>
      <input class="f moneyin" id="monto" inputmode="numeric" placeholder="$0" autocomplete="off">
      <div class="chips">
        <button class="chip q" id="btnPagarTodo">Pagó todo (${COP(saldoActual)})</button>
      </div>
      <div style="height:26px"></div>
      <button class="btn btn-green" id="guardar">Guardar abono</button>
    </div>`);
  el.querySelector('.x').onclick=()=>closeView(el);

  const selFac = el.querySelector('#selFactura');
  const inpFac = el.querySelector('#facturaAbono');
  if(selFac){
    selFac.onchange=()=>{
      if(selFac.value === '__otra'){
        inpFac.style.display = 'block';
        inpFac.value = '';
        inpFac.focus();
      } else {
        inpFac.style.display = 'none';
        inpFac.value = selFac.value;
      }
    };
  }

  const monto=el.querySelector('#monto');
  monto.oninput=()=>{const raw=monto.value.replace(/\D/g,''); monto.value=raw?('$'+NUM(+raw)):'';};
  el.querySelector('#btnPagarTodo').onclick=()=>{monto.value='$'+NUM(saldoActual);};

  el.querySelector('#guardar').onclick=async()=>{
    const val=+monto.value.replace(/\D/g,'');
    if(!val||val<=0) return toast('Escribe el monto');

    const facFinal = inpFac ? inpFac.value.trim() : (selFac ? selFac.value.trim() : '');

    await put('movimientos',{
      id: uid(),
      clienteId,
      tipo: 'abono',
      monto: val,
      factura: facFinal,
      descripcion: '',
      fecha: isoCO(),
      creado: isoCO()
    });

    // Recargar estado antes de calcular saldos
    await cargarTodo();
    render();
    closeView(el);

    const nuevoSaldo = saldoDe(clienteId);
    
    // Pantalla de confirmación con acceso directo a WhatsApp
    abrirConfirmacionAbono(c, nuevoSaldo, val, facFinal);
  };
  setTimeout(()=>monto.focus(),350);
}

/* ---- WhatsApp: Cobro / Comprobante con detalle exacto ---- */
function mensajeDefault(nombre, saldo, cId){
  const t = CFG.tienda || 'la tienda';
  const firma = CFG.tendero ? ('\n\n— ' + CFG.tendero) : '';
  const alDia = saldo <= 0.5;
  
  // Movimientos ordenados cronológicamente
  const ms = movsDe(cId).slice().reverse();
  let detalleTxt = '';

  if(ms.length > 0){
    detalleTxt = '\n\n*Detalle de movimientos:*';
    ms.forEach(m => {
      const fecha = fechaCO(m.fecha);
      if(m.tipo === 'fiado'){
        const fac = m.factura ? ` (Fact: #${m.factura})` : '';
        const desc = m.descripcion ? ` · ${m.descripcion}` : '';
        detalleTxt += `\n➕ ${fecha} Fiado: ${COP(m.monto)}${fac}${desc}`;
      } else {
        const fac = m.factura ? ` (A Fact: #${m.factura})` : '';
        detalleTxt += `\n➖ ${fecha} Abono: ${COP(m.monto)}${fac}`;
      }
    });
  }

  if(alDia){
    return `Hola ${nombre} 👋 Le escribo de *${t}*.\n\nLe confirmamos que su cuenta se encuentra *completamente al día*. ¡Muchas gracias por su puntualidad y confianza! 🙌${detalleTxt}\n\n📌 *Saldo pendiente:* ${COP(0)}${firma}`;
  }

  return `Hola ${nombre} 👋 Le escribo de *${t}*.\n\nLe comparto el estado de su cuenta con nosotros:${detalleTxt}\n\n📌 *Saldo pendiente:* ${COP(saldo)}\n\nCuando pueda me colabora, ¡mil gracias! 🙏${firma}`;
}

function enviarWhatsAppCliente(c, saldo){
  let msg = (CFG.plantilla && CFG.plantilla.trim())
    ? CFG.plantilla
        .replaceAll('{nombre}', c.nombre)
        .replaceAll('{monto}', COP(saldo))
        .replaceAll('{tienda}', CFG.tienda || 'la tienda')
    : mensajeDefault(c.nombre.split(' ')[0] ? ('Don/Doña ' + c.nombre.split(' ').slice(-1)[0]) : c.nombre, saldo, c.id);

  const el = openView(`
    <div class="vhead"><button class="x">‹</button><h2>Enviar comprobante</h2></div>
    <div class="vbody">
      <div class="notice">Revisa el comprobante antes de enviarlo. Contiene el historial detallado y el saldo exacto.</div>
      <label class="f">Mensaje</label>
      <textarea class="f" id="msg" rows="11">${esc(msg)}</textarea>
      ${c.telefono ? '' : '<div class="notice" style="border-color:var(--amber)">Este cliente no tiene teléfono. Agrégalo en su perfil o comparte el mensaje manualmente.</div>'}
      <div style="height:20px"></div>
      <button class="btn btn-wa" id="enviar">Abrir WhatsApp</button>
      <div style="height:10px"></div>
      <button class="btn btn-ghost" id="copiar">Copiar mensaje</button>
    </div>`);

  el.querySelector('.x').onclick = () => closeView(el);
  el.querySelector('#enviar').onclick = () => {
    const texto = encodeURIComponent(el.querySelector('#msg').value);
    let phone = (c.telefono || '').replace(/\D/g, '');
    if(phone && phone.length === 10) phone = '57' + phone;
    const url = phone ? `https://wa.me/${phone}?text=${texto}` : `https://wa.me/?text=${texto}`;
    window.open(url, '_blank');
  };
  el.querySelector('#copiar').onclick = async () => {
    try { 
      await navigator.clipboard.writeText(el.querySelector('#msg').value); 
      toast('Mensaje copiado ✔'); 
    } catch { 
      toast('Copia manual: mantén presionado el texto'); 
    }
  };
}

function stampCO(){ return nowCO().toLocaleDateString('en-CA',{timeZone:'America/Bogota'}); }
function nombreTienda(){ return (CFG.tienda||'Mi tienda').replace(/[\\/:*?"<>|]/g,'').trim()||'Mi tienda'; }
function horaCO(iso){ try{ return new Date(iso).toLocaleTimeString('es-CO',{timeZone:'America/Bogota',hour:'2-digit',minute:'2-digit',hour12:true}); }catch(e){ return ''; } }
function fechaCorta(iso){ try{ return new Date(iso).toLocaleDateString('es-CO',{timeZone:'America/Bogota',day:'2-digit',month:'2-digit',year:'numeric'}); }catch(e){ return ''; } }

async function compartirODescargar(blob, filename, titulo){
  try{
    const file = new File([blob], filename, {type: blob.type});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:titulo, text:titulo});
      toast('Copia enviada ✔'); return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; }
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  toast('Archivo descargado ✔');
}

function resumenDatos(){
  const filas = CLIENTES.map(c=>{
    const ms = MOVS.filter(m=>m.clienteId===c.id);
    const fiado = ms.filter(m=>m.tipo==='fiado').reduce((s,m)=>s+(+m.monto||0),0);
    const abono = ms.filter(m=>m.tipo==='abono').reduce((s,m)=>s+(+m.monto||0),0);
    return { c, movs:ms.length, fiado, abono, saldo: fiado-abono, dias: deudaMasVieja(c.id) };
  }).sort((a,b)=> b.saldo-a.saldo || a.c.nombre.localeCompare(b.c.nombre));
  const totalFiado = filas.reduce((s,x)=>s+x.fiado,0);
  const totalAbono = filas.reduce((s,x)=>s+x.abono,0);
  const porCobrar  = filas.filter(x=>x.saldo>0.5).reduce((s,x)=>s+x.saldo,0);
  const deben = filas.filter(x=>x.saldo>0.5).length;
  return { filas, totalFiado, totalAbono, porCobrar, deben, alDia: filas.length-deben, nMovs: MOVS.length };
}

function xesc(s){ return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[m])); }
const cT = v => '<Cell ss:StyleID="txt"><Data ss:Type="String">'+xesc(v)+'</Data></Cell>';
const cN = v => '<Cell ss:StyleID="cop"><Data ss:Type="Number">'+(Math.round(Number(v)||0))+'</Data></Cell>';
const cI = v => '<Cell ss:StyleID="txt"><Data ss:Type="Number">'+(Math.round(Number(v)||0))+'</Data></Cell>';
const cH = v => '<Cell ss:StyleID="hd"><Data ss:Type="String">'+xesc(v)+'</Data></Cell>';
const fila = cells => '<Row>'+cells.join('')+'</Row>';

function construirExcel(conTelefono){

    '<Worksheet ss:Name="'+xesc(nombre)+'"><Table>'+filas.join('')+'</Table>'+
    '<WorksheetOptions xmlns="urn:schemas-microsoft-com:office:excel"><FreezePanes/><FrozenNoSplit/><SplitHorizontal>1</SplitHorizontal><TopRowBottomPane>1</TopRowBottomPane><ActivePane>2</ActivePane></WorksheetOptions></Worksheet>';

  const h1 = [
    fila([cH('RESPALDO — CUADERNO DE FIADO')]),
    fila([cT('Tienda'), cT(CFG.tienda||'Mi tienda')]),
    fila([cT('Tendero'), cT(CFG.tendero||'—')]),
    fila([cT('Fecha del respaldo'), cT(fechaCorta(new Date().toISOString())+' '+horaCO(new Date().toISOString())+' (Colombia UTC−5)')]),
    fila([cT('')]),
    fila([cH('CONCEPTO'), cH('VALOR')]),
    fila([cT('Total por cobrar'), cN(R.porCobrar)]),
    fila([cT('Total fiado histórico'), cN(R.totalFiado)]),
    fila([cT('Total abonado histórico'), cN(R.totalAbono)]),
    fila([cT('Clientes registrados'), cI(R.filas.length)]),
    fila([cT('Clientes que deben'), cI(R.deben)]),
    fila([cT('Clientes al día'), cI(R.alDia)]),
    fila([cT('Movimientos registrados'), cI(R.nMovs)])
  ];

  const h2 = [ fila([cH('CLIENTE'),cH('TELÉFONO'),cH('SALDO ACTUAL'),cH('TOTAL FIADO'),cH('TOTAL ABONADO'),cH('DÍAS DEUDA MÁS VIEJA'),cH('ESTADO'),cH('MOVIMIENTOS'),cH('CLIENTE DESDE'),cH('AUTORIZÓ DATOS')]) ];
  R.filas.forEach(x=>{
    h2.push(fila([
      cT(x.c.nombre),
      cT(conTelefono? (x.c.telefono||'—') : maskPhone(x.c.telefono)),
      cN(x.saldo), cN(x.fiado), cN(x.abono),
      cI(x.saldo>0.5? x.dias : 0),
      cT(x.saldo>0.5?'Debe':'Al día'),
      cI(x.movs),
      cT(x.c.creado? fechaCorta(x.c.creado):'—'),
      cT(x.c.consentimiento?'Sí':'No')
    ]));
  });
  h2.push(fila([cH('TOTAL'),cT(''),cN(R.porCobrar),cN(R.totalFiado),cN(R.totalAbono),cT(''),cT(''),cI(R.nMovs),cT(''),cT('')]));

  const h3 = [ fila([cH('FECHA'),cH('HORA'),cH('CLIENTE'),cH('TELÉFONO'),cH('TIPO'),cH('FACTURA'),cH('DESCRIPCIÓN'),cH('FIADO (+)'),cH('ABONO (−)'),cH('ID')]) ];
  const porFecha = MOVS.slice().sort((a,b)=> new Date(a.fecha)-new Date(b.fecha));
  porFecha.forEach(m=>{
    const c = CLIENTES.find(x=>x.id===m.clienteId);
    h3.push(fila([
      cT(fechaCorta(m.fecha)), cT(horaCO(m.fecha)),
      cT(c? c.nombre : '(cliente eliminado)'),
      cT(c? (conTelefono? (c.telefono||'—') : maskPhone(c.telefono)) : '—'),
      cT(m.tipo==='fiado'?'Fiado':'Abono'),
      cT(m.factura||''),
      cT(m.descripcion||''),
      cN(m.tipo==='fiado'? m.monto : 0),
      cN(m.tipo==='abono'? m.monto : 0),
      cT(m.id)
    ]));
  });
  h3.push(fila([cH('TOTALES'),cT(''),cT(''),cT(''),cT(''),cT(''),cT(''),cN(R.totalFiado),cN(R.totalAbono),cT('')]));

  return '<?xml version="1.0" encoding="UTF-8"?>\n'+
  '<?mso-application progid="Excel.Sheet"?>\n'+
  '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'+
  '<Styles>'+
    '<Style ss:ID="Default" ss:Name="Normal"><Font ss:FontName="Calibri" ss:Size="11"/><Alignment ss:Vertical="Center"/></Style>'+
    '<Style ss:ID="hd"><Font ss:FontName="Calibri" ss:Size="11" ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#0B5D3B" ss:Pattern="Solid"/><Alignment ss:Vertical="Center" ss:WrapText="1"/></Style>'+
    '<Style ss:ID="txt"><Font ss:FontName="Calibri" ss:Size="11"/></Style>'+
    '<Style ss:ID="cop"><Font ss:FontName="Calibri" ss:Size="11"/><NumberFormat ss:Format="&quot;$&quot;#,##0"/></Style>'+
  '</Styles>'+
  hoja('Resumen',h1)+hoja('Clientes',h2)+hoja('Movimientos',h3)+
  '</Workbook>';
}

function csvCell(v){
  let s = String(v==null?'':v);
  if(/^[=+\-@]/.test(s)) s="'"+s;
  return '"'+s.replace(/"/g,'""')+'"';
}
async function exportarCSV(conTelefono){
  if(!CLIENTES.length){ toast('Todavía no hay datos para exportar'); return; }
  const R = resumenDatos(); const L=[];
  L.push(['RESPALDO FIADO',nombreTienda()].map(csvCell).join(';'));

  L.push('');
  L.push('CLIENTES');
  L.push(['Cliente','Telefono','Saldo actual','Total fiado','Total abonado','Dias deuda mas vieja','Estado','Movimientos','Cliente desde','Autorizo datos'].map(csvCell).join(';'));
  R.filas.forEach(x=>L.push([x.c.nombre, conTelefono?(x.c.telefono||''):maskPhone(x.c.telefono), Math.round(x.saldo), Math.round(x.fiado), Math.round(x.abono), (x.saldo>0.5?x.dias:0), (x.saldo>0.5?'Debe':'Al dia'), x.movs, x.c.creado?fechaCorta(x.c.creado):'', x.c.consentimiento?'Si':'No'].map(csvCell).join(';')));
  L.push('');
  L.push('MOVIMIENTOS');
  L.push(['Fecha','Hora','Cliente','Tipo','Factura','Descripcion','Fiado (+)','Abono (-)','ID'].map(csvCell).join(';'));
  MOVS.slice().sort((a,b)=>new Date(a.fecha)-new Date(b.fecha)).forEach(m=>{
    const c=CLIENTES.find(x=>x.id===m.clienteId);
    L.push([
      fechaCorta(m.fecha),
      horaCO(m.fecha),
      c?c.nombre:'(eliminado)',
      m.tipo==='fiado'?'Fiado':'Abono',
      m.factura||'',
      m.descripcion||'',
      m.tipo==='fiado'?Math.round(m.monto):0,
      m.tipo==='abono'?Math.round(m.monto):0,
      m.id
    ].map(csvCell).join(';'));
  });
  const blob=new Blob(['\ufeff'+L.join('\r\n')],{type:'text/csv;charset=utf-8'});
  await compartirODescargar(blob,'Fiado-'+stampCO()+'.csv','Respaldo Fiado CSV');
}

function reporteTexto(conTelefono, conDetalle){
  const R = resumenDatos();
  const T=[];
  T.push('📓 *RESPALDO FIADO — '+(CFG.tienda||'Mi tienda').toUpperCase()+'*');
  T.push('🗓 '+fechaCorta(new Date().toISOString())+'  '+horaCO(new Date().toISOString())+' (Colombia)');
  T.push('');
  T.push('*RESUMEN*');
  T.push('• Total por cobrar: *'+COP(R.porCobrar)+'*');
  T.push('• Clientes: '+R.filas.length+'  (deben '+R.deben+' · al día '+R.alDia+')');
  T.push('• Fiado histórico: '+COP(R.totalFiado));
  T.push('• Abonado histórico: '+COP(R.totalAbono));
  T.push('• Movimientos: '+R.nMovs);

  const deudores = R.filas.filter(x=>x.saldo>0.5);
  if(deudores.length){
    T.push('');
    T.push('*QUIÉNES DEBEN ('+deudores.length+')*');
    deudores.forEach((x,i)=>{
      T.push((i+1)+'. '+x.c.nombre+' — *'+COP(x.saldo)+'*'+(x.dias?' (hace '+x.dias+' día'+(x.dias===1?'':'s')+')':'')+(conTelefono&&x.c.telefono?' · '+x.c.telefono:''));
    });
  }
  const alDia = R.filas.filter(x=>x.saldo<=0.5);
  if(alDia.length){
    T.push('');
    T.push('*AL DÍA ('+alDia.length+')*');
    T.push(alDia.map(x=>x.c.nombre).join(', '));
  }
  if(conDetalle && MOVS.length){
    T.push('');
    T.push('———————————');
    T.push('*DETALLE DE MOVIMIENTOS*');
    R.filas.forEach(x=>{
      const ms = movsDe(x.c.id).slice().reverse();
      if(!ms.length) return;
      T.push('');
      T.push('▸ *'+x.c.nombre+'*  (saldo '+COP(x.saldo)+')');
      ms.forEach(m=>{
        const facTxt = m.factura ? ' [Fact: #' + m.factura + ']' : '';
        T.push('   '+fechaCorta(m.fecha)+'  '+(m.tipo==='fiado'?'Fiado':'Abono')+facTxt+(m.descripcion?' · '+m.descripcion:'')+'  '+(m.tipo==='fiado'?'+':'−')+COP(m.monto));
      });
    });
  }
  T.push('');
  T.push('_Generado por Fiado — Vibras Positivas HM_');
  return T.join('\n');
}

async function restaurarArchivo(file){
  try{
    const txt = await file.text();
    const data = JSON.parse(txt);
    if(!data || !Array.isArray(data.clientes) || !Array.isArray(data.movimientos)) throw new Error('formato');
    if(!confirm('Se van a agregar '+data.clientes.length+' clientes y '+data.movimientos.length+' movimientos del respaldo.\n\nLo que ya tienes en el celular NO se borra. ¿Continuar?')) return;
    let nc=0, nm=0;
    for(const c of data.clientes){ if(c && c.id){ await put('clientes',c); nc++; } }
    for(const m of data.movimientos){ if(m && m.id){ await put('movimientos',m); nm++; } }
    if(data.config && typeof data.config==='object'){
      const guardar = (!CFG.tienda || CFG.tienda==='Mi tienda') && !CFG.tendero;
      if(guardar){ CFG=Object.assign(CFG,data.config,{k:'cfg'}); await guardarCfg(); }
    }
    await cargarTodo(); filtro=''; render(); closeModal();
    toast('Restaurado: '+nc+' clientes y '+nm+' movimientos ✔');
  }catch(e){
    console.error(e);
    alert('No se pudo leer el archivo. Debe ser un respaldo .json generado por esta misma app.');
  }
}

/* ---- Toast / clock ---- */
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400);}
function tickClock(){
  const d=nowCO();
  const hora=d.toLocaleTimeString('es-CO',{timeZone:'America/Bogota',hour:'2-digit',minute:'2-digit',hour12:true});
  const fecha=d.toLocaleDateString('es-CO',{timeZone:'America/Bogota',weekday:'short',day:'numeric',month:'short'});
  const c=document.getElementById('clock'); c.innerHTML=`<b>${hora}</b><span>${fecha}</span>`;
}

/* ---- Eventos globales ---- */
document.getElementById('fab').onclick=()=>abrirFiar();
document.getElementById('btnGear').onclick=abrirAjustes;
window.abrirCliente=abrirCliente; window.abrirFiar=abrirFiar; window.abrirAbono=abrirAbono;
window.abrirNuevoCliente=abrirNuevoCliente; window.cargarEjemplo=cargarEjemplo;
window.mostrarPolitica=mostrarPolitica; window.exportar=exportar; window.borrarTodo=borrarTodo; window.closeModal=closeModal;
window.abrirRespaldo=abrirRespaldo; window.exportarExcel=exportarExcel; window.exportarCSV=exportarCSV; window.enviarWhatsApp=enviarWhatsApp;
window.cambiarFiltroVista=cambiarFiltroVista;

/* ---- Init ---- */
(async function init(){
  tickClock(); setInterval(tickClock,1000*20);
  try{ await openDB(); await cargarTodo(); render(); }
  catch(e){ main.innerHTML='<div class="empty"><div class="em">⚠️</div><h3>No se pudo abrir el almacenamiento</h3><p>Abre la app en tu navegador (Chrome/Safari) fuera del modo incógnito para guardar tus datos.</p></div>'; console.error(e); }
})();
</script>
